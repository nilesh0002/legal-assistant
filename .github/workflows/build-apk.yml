name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyayaSahayak-LegalAssistant-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('NyayaSahayak Release {0}', github.ref_name) || 'NyayaSahayak Android App (Latest Build)' }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### NyayaSahayak: Indian Legal Knowledge Assistant (Android APK)

            **Features in this release:**
            - Grounded RAG legal assistant for Indian Law.
            - Layer 1: Simple / Detailed explanation toggle.
            - Layer 2: Verbatim statutory quote, Section/Article, previous CrPC mapping, and official government link.
            - On-device private chat history and feedback ratings.
            - Covers Constitution of India (Preamble, Part III, Part IV, Part IVA) and BNSS 2023 (Arrest and Bail).
            
            **Direct Download:**
            Download `app-debug.apk` from the Assets below.

            **Installation Instructions:**
            1. Download `app-debug.apk` to your Android device.
            2. Allow *Install Unknown Apps* for your browser / file manager if prompted.
            3. Tap the file to install and open.
          draft: false
          prerelease: false
